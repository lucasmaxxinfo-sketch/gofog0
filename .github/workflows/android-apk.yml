name: Build Android APK and Web Package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app
        run: node scripts/check-html.cjs
      - name: Package browser version
        run: |
          mkdir -p web-package
          cp index.html manifest.webmanifest README.md web-package/
          touch web-package/.nojekyll
          cd web-package
          zip -r ../file-intelligence-agent-web.zip .
      - name: Publish web package
        uses: actions/upload-artifact@v4
        with:
          name: file-intelligence-agent-web
          path: file-intelligence-agent-web.zip
          if-no-files-found: error
          retention-days: 30
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Prepare app files
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest www/
      - name: Generate Android project
        run: npx cap add android
      - name: Sync app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: file-intelligence-agent-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
