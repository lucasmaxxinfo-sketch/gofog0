name: Package File Intelligence Agent web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-web-app:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate app JavaScript
        run: node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const m=h.match(/<script>([\\s\\S]*?)<\\/script>/); if(!m) throw new Error('No inline script found'); new Function(m[1]); console.log('Inline JavaScript syntax OK');"
      - name: Package web app
        run: |
          mkdir -p web-app
          cp index.html manifest.webmanifest README.md web-app/
          cd web-app && zip -r ../file-intelligence-agent-web.zip .
      - name: Upload web app package
        uses: actions/upload-artifact@v4
        with:
          name: file-intelligence-agent-web
          path: file-intelligence-agent-web.zip
          retention-days: 30
